ekf_filter_node:
    ros__parameters:
        frequency: 30.0
        sensor_timeout: 0.1
        two_d_mode: false
        transform_time_offset: 0.0
        transform_timeout: 0.0
        print_diagnostics: true
        debug: false
        
        # Publish tf so other nodes can use the odometry tree
        publish_tf: false
        map_frame: map
        odom_frame: odom
        base_link_frame: base_link
        world_frame: odom
        
        # VINS Front Odometry
        odom0: /vins_front/vins_estimator/odometry
        odom0_config: [true,  true,  true,
                       true,  true,  true,
                       false, false, false,
                       false, false, false,
                       false, false, false]
        odom0_queue_size: 10
        odom0_nodelay: true
        odom0_differential: false
        odom0_relative: false
        
        # VINS Back Odometry
        odom1: /vins_back/vins_estimator/odometry
        odom1_config: [true,  true,  true,
                       true,  true,  true,
                       false, false, false,
                       false, false, false,
                       false, false, false]
        odom1_queue_size: 10
        odom1_nodelay: true
        odom1_differential: false
        odom1_relative: false

        # Initial pose
        use_control: false
